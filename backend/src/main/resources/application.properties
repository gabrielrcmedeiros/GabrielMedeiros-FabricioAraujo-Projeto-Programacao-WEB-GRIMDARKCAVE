spring.application.name=grimdarkcave

# Porta da API
server.port=8081

# Conexao com o MySQL local (o banco e criado se nao existir)
spring.datasource.url=jdbc:mysql://localhost:3306/grimdarkcave?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Tabelas criadas e atualizadas a partir das entidades
spring.jpa.hibernate.ddl-auto=update

# Valor padrao declarado para evitar aviso no console
spring.jpa.open-in-view=true

# true exibe no console o SQL gerado
spring.jpa.show-sql=false
