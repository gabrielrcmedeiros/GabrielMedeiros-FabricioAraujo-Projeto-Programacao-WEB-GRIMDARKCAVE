<div class="mt-2 mt-md-4 text-light">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-7">

      <div class="p-3 p-md-4 painel shadow">

        <!-- Abas: login e cadastro -->
        <div class="d-flex justify-content-around mb-4 pb-3 abas" role="tablist">
          <button type="button" class="btn fw-bold fs-5 text-uppercase aba" role="tab" [attr.aria-selected]="!modoCadastro()"
                  [class.text-white]="!modoCadastro()" [class.text-muted]="modoCadastro()" (click)="alternarModo(false)">
            Já tenho cadastro
          </button>
          <span class="text-secondary fs-4">|</span>
          <button type="button" class="btn fw-bold fs-5 text-uppercase aba" role="tab" [attr.aria-selected]="modoCadastro()"
                  [class.text-white]="modoCadastro()" [class.text-muted]="!modoCadastro()" (click)="alternarModo(true)">
            Criar Conta
          </button>
        </div>

        @if (!modoCadastro()) {
          <!-- Login -->
          <form [formGroup]="loginForm" (ngSubmit)="fazerLogin()">
            <div class="mb-3">
              <label class="form-label" for="login-email">E-mail de Acesso</label>
              <input id="login-email" type="email" formControlName="email" autocomplete="email" class="form-control campo-escuro"
                     placeholder="exemplo@grimdark.com" [class.is-invalid]="loginForm.controls.email.invalid && loginForm.controls.email.touched">
              <div class="invalid-feedback">Insira um e-mail válido para acessar as criptas.</div>
            </div>

            <!-- Senha com botão de exibir -->
            <div class="mb-3">
              <label class="form-label" for="login-senha">Senha</label>
              <div class="input-group has-validation">
                <input id="login-senha" [type]="mostrarSenhaLogin() ? 'text' : 'password'" formControlName="senha" autocomplete="current-password"
                       class="form-control campo-escuro" placeholder="******"
                       [class.is-invalid]="loginForm.controls.senha.invalid && loginForm.controls.senha.touched">
                <button class="btn btn-outline-secondary" type="button" (click)="mostrarSenhaLogin.set(!mostrarSenhaLogin())"
                        [attr.aria-label]="mostrarSenhaLogin() ? 'Ocultar senha' : 'Mostrar senha'">
                  <i class="bi" [class.bi-eye]="!mostrarSenhaLogin()" [class.bi-eye-slash]="mostrarSenhaLogin()"></i>
                </button>
                <div class="invalid-feedback">A senha requer no mínimo 6 caracteres.</div>
              </div>
            </div>

            <div class="d-flex justify-content-between align-items-center mb-4">
              <a routerLink="/esqueci" class="text-decoration-none small icone-ferrugem">Esqueci minha senha</a>
            </div>

            <!-- Habilitado só com o formulário válido -->
            <button type="submit" class="btn btn-grimdark w-100 py-2 fw-bold text-uppercase" [disabled]="loginForm.invalid || enviando()">
              @if (enviando()) {
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
              }
              Entrar
            </button>
          </form>
        } @else {
          <!-- Cadastro -->
          <form [formGroup]="cadastroForm" (ngSubmit)="fazerCadastro()">
            <div class="mb-3">
              <label class="form-label" for="cad-nome">Nome Completo</label>
              <input id="cad-nome" type="text" formControlName="nome" autocomplete="name" class="form-control campo-escuro" placeholder="Seu nome"
                     [class.is-invalid]="cadastroForm.controls.nome.invalid && cadastroForm.controls.nome.touched">
              <div class="invalid-feedback">Informe pelo menos 3 caracteres.</div>
            </div>

            <div class="mb-3">
              <label class="form-label" for="cad-email">E-mail</label>
              <input id="cad-email" type="email" formControlName="email" autocomplete="email" class="form-control campo-escuro" placeholder="seu@email.com"
                     [class.is-invalid]="cadastroForm.controls.email.invalid && cadastroForm.controls.email.touched">
              <div class="invalid-feedback">Informe um e-mail válido.</div>
            </div>

            <div class="row">
              <div class="col-md-6 mb-3">
                <label class="form-label" for="cad-senha">Senha</label>
                <div class="input-group has-validation">
                  <input id="cad-senha" [type]="mostrarSenhaCadastro() ? 'text' : 'password'" formControlName="senha" autocomplete="new-password"
                         class="form-control campo-escuro" placeholder="Mínimo 6 dígitos"
                         [class.is-invalid]="cadastroForm.controls.senha.invalid && cadastroForm.controls.senha.touched">
                  <button class="btn btn-outline-secondary" type="button" (click)="mostrarSenhaCadastro.set(!mostrarSenhaCadastro())"
                          [attr.aria-label]="mostrarSenhaCadastro() ? 'Ocultar senha' : 'Mostrar senha'">
                    <i class="bi" [class.bi-eye]="!mostrarSenhaCadastro()" [class.bi-eye-slash]="mostrarSenhaCadastro()"></i>
                  </button>
                  <div class="invalid-feedback">Mínimo de 6 caracteres.</div>
                </div>
              </div>

              <!-- CPF com filtro de digitação e validação -->
              <div class="col-md-6 mb-3">
                <label class="form-label" for="cad-cpf">CPF</label>
                <input id="cad-cpf" type="text" formControlName="cpf" inputmode="numeric" class="form-control campo-escuro"
                       placeholder="000.000.000-00" maxlength="14" (input)="filtrarCpf($event)"
                       [class.is-invalid]="cadastroForm.controls.cpf.invalid && cadastroForm.controls.cpf.touched">
                <div class="invalid-feedback">CPF inválido.</div>
              </div>
            </div>

            <div class="mb-4">
              <label class="form-label" for="cad-telefone">Telefone</label>
              <input id="cad-telefone" type="text" formControlName="telefone" inputmode="tel" autocomplete="tel" class="form-control campo-escuro"
                     placeholder="(11) 90000-0000" maxlength="15" (input)="filtrarTelefone($event)"
                     [class.is-invalid]="cadastroForm.controls.telefone.invalid && cadastroForm.controls.telefone.touched">
              <div class="invalid-feedback">Use o formato (11) 90000-0000.</div>
            </div>

            <button type="submit" class="btn btn-grimdark w-100 py-2 fw-bold text-uppercase" [disabled]="cadastroForm.invalid || enviando()">
              @if (enviando()) {
                <span class="spinner-border spinner-border-sm me-2" aria-hidden="true"></span>
              }
              Cadastrar
            </button>
          </form>
        }

      </div>
    </div>
  </div>
</div>
