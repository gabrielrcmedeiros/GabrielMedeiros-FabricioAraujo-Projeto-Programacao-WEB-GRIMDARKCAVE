<div class="container mt-2">
  <h2 class="mb-4 text-white" style="border-bottom: 2px solid var(--rust-red); padding-bottom: 10px;">Catálogo de Sobrevivência</h2>
  
  <div class="row">
    <!-- Estrutura de repeticao para renderizacao dinamica da matriz de produtos do catalogo -->
    <div class="col-12 col-md-6 col-lg-4 mb-4" *ngFor="let obj of lista">
      
      <!-- Container principal do cartao de produto -->
      <div class="card h-100 border-secondary" style="background-color: #1a1a1f; box-shadow: 0 4px 8px rgba(0,0,0,0.5);">
        
        <!-- Renderizacao da midia associada ao produto baseada em identificador numerico -->
        <img [src]="obj.codigo + '.jpg'" class="card-img-top" alt="Capa do jogo" style="height: 220px; object-fit: cover; border-bottom: 1px solid #333;">
        
        <div class="card-body d-flex flex-column text-light">
          <h5 class="card-title fw-bold" style="color: var(--text-main);">{{ obj.nome }}</h5>
          
          <!-- Bloco de descricao textual do produto -->
          <p class="card-text small mb-4" style="color: #a0a0a0; line-height: 1.4;">{{ obj.descritivo }}</p>
          
          <!-- Secao inferior dedicada a precificacao e acoes de conversao -->
          <div class="mt-auto">
            
            <!-- Logica condicional para exibicao de valores com desconto financeiro aplicado -->
            <p class="mb-3" *ngIf="obj.promo > 0">
              <span class="text-decoration-line-through text-muted me-2">R$ {{ obj.valor | number:'1.2-2' }}</span>
              <span class="fw-bold fs-4" style="color: var(--rust-red);">R$ {{ obj.promo | number:'1.2-2' }}</span>
            </p>
            
            <!-- Logica condicional para exibicao de valor integral padrao -->
            <p class="mb-3 fw-bold fs-4" style="color: var(--text-main);" *ngIf="obj.promo <= 0">
              R$ {{ obj.valor | number:'1.2-2' }}
            </p>
            
            <!-- Grupo de controles interativos do produto -->
            <div class="d-flex justify-content-between gap-2">
              <button class="btn btn-outline-secondary w-50 text-light" (click)="verDetalhe(obj)">Ver Detalhes</button>
              <button class="btn btn-grimdark w-50" *ngIf="obj.quantidade > 0" (click)="adicionarCesta(obj)">Comprar</button>
              <button class="btn btn-dark border-secondary text-muted w-50" *ngIf="obj.quantidade <= 0" disabled>Esgotado</button>
            </div>
            
          </div>

        </div>
      </div>
    </div>
  </div>
</div>
